<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApartemenKu — Pembukuan Saladin Mansion</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
  <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
  <script src="[https://unpkg.com/lucide@latest](https://unpkg.com/lucide@latest)"></script>
  <link href="[https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap)" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FAF8F5',
            creamDark: '#F2EDE4',
            slate900: '#0F172A',
            amber500: '#F59E0B',
            amber600: '#D97706'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FAF8F5; color: #0F172A; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-large { font-size: 112%; }
    .dark-mode { background-color: #0F172A; color: #F8FAFC; }
    .dark-mode .card-surface { background-color: #1E293B; border-color: #334155; color: #F8FAFC; }
    .dark-mode .input-surface { background-color: #0F172A; border-color: #334155; color: #F8FAFC; }
    .dark-mode .text-muted { color: #94A3B8; }
    .card-surface { background-color: #FFFFFF; border: 1px solid #E2E8F0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24 md:pb-8">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-4 right-4 z-50 hidden max-w-xs rounded-xl bg-slate-900 text-white px-4 py-3 shadow-xl border border-amber-500/40 text-sm font-medium transition-all"></div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-cream">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-amber-400 shadow-md">
          <i data-lucide="building-2" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">ApartemenKu</h1>
          <p class="text-xs font-medium text-amber-600">Sistem Pembukuan Saladin Mansion</p>
        </div>
      </div>

      <div class="flex rounded-xl bg-creamDark p-1 mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-slate-900 text-white shadow">Masuk</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-600">Daftar Akun</button>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
          <input type="email" id="auth-email" required placeholder="nama@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-amber-500 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-amber-500 text-sm" />
        </div>
        <button type="submit" id="auth-submit-btn" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold text-sm shadow-md transition">
          Masuk ke Aplikasi
        </button>
      </form>
      <p id="auth-info" class="mt-4 text-xs text-center text-slate-500">Data tersinkronisasi aman dengan cloud Supabase.</p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="hidden">
    <!-- TOP HEADER -->
    <header class="sticky top-0 z-30 bg-slate-900 text-white shadow-md">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-900 flex items-center justify-center font-bold">
            <i data-lucide="building-2" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-extrabold text-base tracking-tight">ApartemenKu</h1>
              <select id="header-apt-selector" onchange="onSwitchApartment(this.value)" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 focus:outline-none"></select>
            </div>
            <p id="header-user-email" class="text-[11px] text-slate-400 truncate max-w-[180px] sm:max-w-xs"></p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="syncAllData(true)" title="Sinkronkan Data" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
          <button onclick="handleLogout()" title="Keluar" class="px-3 py-1.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-bold flex items-center gap-1">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Keluar</span>
          </button>
        </div>
      </div>

      <!-- DESKTOP NAV -->
      <nav class="hidden md:block bg-slate-800/80 border-t border-slate-700">
        <div class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto no-scrollbar">
          <button onclick="navigate('dashboard')" data-nav="dashboard" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-amber-500 text-amber-400">Dashboard</button>
          <button onclick="navigate('transactions')" data-nav="transactions" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Transaksi Tamu</button>
          <button onclick="navigate('expenses')" data-nav="expenses" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Pengeluaran</button>
          <button onclick="navigate('calendar')" data-nav="calendar" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Kalender</button>
          <button onclick="navigate('apartment')" data-nav="apartment" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Unit & Sewa</button>
          <button onclick="navigate('reports')" data-nav="reports" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Laporan</button>
          <button onclick="navigate('settings')" data-nav="settings" class="nav-btn px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-300 hover:text-white">Pengaturan & Pricelist</button>
        </div>
      </nav>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-
